[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "branch-sweep"
version = "0.1.0"
description = "Delete merged local git branches, with safety checks and a dry run first"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
branch-sweep = "branch_sweep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
